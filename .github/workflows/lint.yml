name: linter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          # composer.lock requires ext-gd (simple-qrcode) and ext-bcmath
          # (moneyphp/money). The runner's default build happens to carry both,
          # so leaving this out works until the day it does not.
          extensions: dom, curl, libxml, mbstring, zip, bcmath, intl, gd

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      - name: Run Pint
        run: composer test:lint

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint
